<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="NOWORKS 앱의 디버그 로그 화면을 여는 안내 페이지입니다.">
  <title>NOWORKS · 로그 열기</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f8fafc; background: radial-gradient(ellipse at 20% 10%, #243b63 0, transparent 45%), #101828; }
    main { width: min(100%, 520px); padding: 36px; border: 1px solid #34445f; border-radius: 24px; background: rgba(20, 32, 53, .88); box-shadow: 0 24px 80px #0005; }
    .tag { display: inline-flex; padding: 7px 11px; border-radius: 999px; background: #203b63; color: #a8ccff; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 22px 0 10px; font-size: clamp(28px, 7vw, 38px); letter-spacing: -.04em; }
    p { color: #b8c4d6; line-height: 1.7; }
    .action { display: flex; justify-content: center; align-items: center; width: 100%; min-height: 54px; margin: 28px 0 12px; border-radius: 14px; background: #76a9fa; color: #10213d; font-weight: 800; text-decoration: none; transition: transform .15s, background .15s; }
    .action:hover { transform: translateY(-2px); background: #91bbff; }
    .code { padding: 14px 16px; border: 1px solid #34445f; border-radius: 12px; background: #0b1424; color: #d7e5fb; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .steps { margin-top: 28px; padding-top: 22px; border-top: 1px solid #34445f; }
    .steps h2 { margin: 0 0 10px; font-size: 15px; }
    .steps ol { margin: 0; padding-left: 20px; color: #b8c4d6; line-height: 1.9; font-size: 14px; }
    footer { margin-top: 26px; color: #8291a8; font-size: 12px; text-align: center; }
    @media (max-width: 480px) { main { padding: 26px 22px; } }
  </style>
</head>
<body>
  <main>
    <span class="tag">NOWORKS SUPPORT</span>
    <h1>앱 로그 열기</h1>
    <p>Android 기기에서 아래 버튼을 누르면 NOWORKS 앱의 디버그 로그 화면으로 이동합니다.</p>
    <a class="action" href="noworkstalk://debug/logs">NOWORKS 로그 열기 ↗</a>
    <p class="code">noworkstalk://debug/logs</p>
    <section class="steps">
      <h2>앱이 열리지 않나요?</h2>
      <ol>
        <li>Android 기기에서 이 페이지를 Chrome으로 열어주세요.</li>
        <li>NOWORKS 앱이 설치되어 있는지 확인해주세요.</li>
        <li>버튼을 다시 눌러 앱 실행을 시도해주세요.</li>
      </ol>
    </section>
    <footer>NOWORKS · 간편 실행 안내</footer>
  </main>
</body>
</html>
